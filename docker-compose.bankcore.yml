version: '3.8'

services:
  # Service 1: Core Banking (8100)
  bankcore-core-banking:
    build:
      context: ./bankcore/services/core-banking-service
      dockerfile: Dockerfile
    container_name: bankcore-core-banking
    ports:
      - "8100:8100"
    environment:
      - PORT=8100
      - DATABASE_URL=postgres://fintech:fintech123@payflow-postgres:5432/bankcore?sslmode=disable
      - REDIS_URL=payflow-redis:6379
      - RABBITMQ_URL=amqp://guest:guest@payflow-rabbitmq:5672/
    networks:
      - payflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3


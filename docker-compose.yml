# ─── BankCore — Docker Compose (local development / log collection) ───────────
# 10 Go microservices + Postgres + Redis + RabbitMQ
#
# Usage:
#   docker compose up --build
#   docker compose logs -f
#   docker compose logs -f bankcore-core-banking

networks:
  bankcore:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech123
      POSTGRES_DB: bankcore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [bankcore]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d bankcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks: [bankcore]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fintech
      RABBITMQ_DEFAULT_PASS: rabbit123
    ports:
      - "5673:5672"
      - "15673:15672"
    networks: [bankcore]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Go Microservices ─────────────────────────────────────────────────────

  core-banking-service:
    build:
      context: ./bankcore/services/core-banking-service
      dockerfile: Dockerfile
    image: bankcore/core-banking-service:latest
    env_file: .env
    environment:
      PORT: "8100"
      SERVICE_NAME: core-banking-service
    ports:
      - "8100:8100"
    networks: [bankcore]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  account-management-service:

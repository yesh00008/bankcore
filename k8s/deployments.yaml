# ─── BankCore — 10 Microservice Deployments ───────────────────────────────────
# Build images (run inside Minikube docker env):
#   eval $(minikube docker-env)
#   for svc in core-banking account-management transaction-processing loan-origination loan-servicing card-management bill-payment customer-service-portal reporting-analytics compliance-aml; do
#     docker build -t bankcore/${svc}-service:latest bankcore/services/${svc}-service/
#   done
---
# ─── Core Banking Service (8100) — primary entry point ────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankcore-core-banking
  namespace: bankcore
  labels:
    app: bankcore-core-banking
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankcore-core-banking
  template:
    metadata:
      labels:
        app: bankcore-core-banking
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
    spec:
      containers:
      - name: core-banking
        image: bankcore/core-banking-service:latest
        imagePullPolicy: Never
        ports:
        - { containerPort: 8100, name: http }
        envFrom:
        - configMapRef: { name: bankcore-config }
        - secretRef:    { name: bankcore-secrets }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "500m" }
        livenessProbe:
          httpGet: { path: /health, port: 8100 }
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health, port: 8100 }
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bankcore-core-banking
  namespace: bankcore
spec:
  selector:
    app: bankcore-core-banking
  ports:
  - { port: 8100, targetPort: 8100, name: http }


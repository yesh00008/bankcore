---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankcore-prometheus-config
  namespace: bankcore
data:
  bankcore-scrape.yaml: |
    scrape_configs:
      - job_name: 'bankcore-core-banking'
        static_configs:
          - targets: ['bankcore-core-banking.bankcore.svc.cluster.local:8100']
        metrics_path: /metrics
      - job_name: 'bankcore-account-management'
        static_configs:
          - targets: ['bankcore-account-management.bankcore.svc.cluster.local:8101']
        metrics_path: /metrics
      - job_name: 'bankcore-transaction-processing'
        static_configs:
          - targets: ['bankcore-transaction-processing.bankcore.svc.cluster.local:8102']
        metrics_path: /metrics
      - job_name: 'bankcore-loan-origination'
        static_configs:
          - targets: ['bankcore-loan-origination.bankcore.svc.cluster.local:8103']
        metrics_path: /metrics
      - job_name: 'bankcore-loan-servicing'
        static_configs:
          - targets: ['bankcore-loan-servicing.bankcore.svc.cluster.local:8104']
        metrics_path: /metrics
      - job_name: 'bankcore-card-management'
        static_configs:
          - targets: ['bankcore-card-management.bankcore.svc.cluster.local:8105']
        metrics_path: /metrics
      - job_name: 'bankcore-bill-payment'
        static_configs:
          - targets: ['bankcore-bill-payment.bankcore.svc.cluster.local:8106']
        metrics_path: /metrics
      - job_name: 'bankcore-customer-portal'
        static_configs:
          - targets: ['bankcore-customer-portal.bankcore.svc.cluster.local:8107']
        metrics_path: /metrics
      - job_name: 'bankcore-reporting-analytics'
        static_configs:
          - targets: ['bankcore-reporting-analytics.bankcore.svc.cluster.local:8108']
        metrics_path: /metrics
      - job_name: 'bankcore-compliance-aml'
        static_configs:
          - targets: ['bankcore-compliance-aml.bankcore.svc.cluster.local:8109']
        metrics_path: /metrics
      - job_name: 'istio-mesh-bankcore'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [bankcore]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: istio-proxy
